[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Automated long-form video to branded vertical shorts pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-whisper>=20231117",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
shorts = "shorts_factory.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]